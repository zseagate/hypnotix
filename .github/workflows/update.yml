name: Update playlist

on:
  schedule:
    # Every 3 hours. Taiwan news channels rotate live-stream IDs within hours,
    # so a slower cadence leaves stale (dead) entries in the playlist.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp must stay current or YouTube extraction breaks.
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh live streams
        run: python scripts/update_playlist.py

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hypnotix-news-bot"
          git config user.email "noreply@github.com"
          git add playlist.m3u status.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update: $(date -u +%Y-%m-%dT%H:%MZ) refresh live streams"
            git push
          fi
